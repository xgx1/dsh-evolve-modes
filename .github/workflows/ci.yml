name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify Harness 0.1.1-rc.2 compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check against Harness 0.1.1-rc.2
        run: pnpm run typecheck

      - name: Build package artifacts
        run: pnpm run build

      - name: Run test suite
        run: pnpm test

      - name: Validate npm package archive
        run: npm pack --dry-run --ignore-scripts
